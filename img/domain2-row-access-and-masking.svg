<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Row access first, then column masking</title>
  <desc id="desc">A source with APAC and EMEA rows is filtered by a row access policy to APAC only. A masking policy then replaces the APAC user's email in the result. Underlying source data is unchanged.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526580"/></marker></defs>
  <rect width="960" height="470" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="32" y="44" font-size="28" font-weight="700">Two policies, two different protections</text>
    <text x="32" y="88" font-size="22" font-weight="700">Source rows</text>
    <text x="355" y="88" font-size="22" font-weight="700">1. Row access</text>
    <text x="675" y="88" font-size="22" font-weight="700">2. Column masking</text>
    <rect x="32" y="111" width="272" height="168" rx="12" fill="#e2e8f0"/>
    <rect x="355" y="111" width="272" height="168" rx="12" fill="#ccfbf1"/>
    <rect x="675" y="111" width="253" height="168" rx="12" fill="#dbeafe"/>
    <text x="49" y="146" font-size="19" font-weight="700">Region  |  Email</text>
    <text x="49" y="191" font-size="19">APAC    a@example.test</text>
    <text x="49" y="235" font-size="19">EMEA   b@example.test</text>
    <text x="372" y="146" font-size="19" font-weight="700">Region  |  Email</text>
    <text x="372" y="191" font-size="19">APAC    a@example.test</text>
    <text x="692" y="146" font-size="19" font-weight="700">Region  |  Email</text>
    <text x="692" y="191" font-size="19">APAC    ***MASKED***</text>
    <path d="M310 199 H349" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M633 199 H669" stroke="#526580" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="32" y="320" font-size="20">Data in the table</text>
    <text x="355" y="320" font-size="20">Only permitted rows</text>
    <text x="675" y="320" font-size="20">Protected column value</text>
    <rect x="32" y="352" width="896" height="80" rx="12" fill="#eef2ff"/>
    <text x="52" y="383" font-size="21">Example context: APAC-only reader without full email access.</text>
    <text x="52" y="415" font-size="20">Policies affect the query result; the stored source data stays unchanged.</text>
  </g>
</svg>
