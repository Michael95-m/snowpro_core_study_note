<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Micro-partition pruning using value ranges</title>
  <desc id="desc">A filter for March skips partitions containing only January or February. Two partitions whose ranges overlap March must still be scanned. Metadata chooses candidates, not exact matching rows.</desc>
  <rect width="960" height="420" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="32" y="45" font-size="28" font-weight="700">Read only candidate micro-partitions</text>
    <rect x="32" y="68" width="896" height="56" rx="10" fill="#e0e7ff"/>
    <text x="55" y="104" font-size="22">Filter: order_date ≥ March 1 AND order_date &lt; April 1</text>
    <text x="32" y="163" font-size="21">Metadata records a value range for each micro-partition.</text>
    <g fill="#e2e8f0">
      <rect x="32" y="192" width="210" height="116" rx="12"/>
      <rect x="258" y="192" width="210" height="116" rx="12"/>
    </g>
    <g fill="#ccfbf1">
      <rect x="484" y="192" width="210" height="116" rx="12"/>
      <rect x="710" y="192" width="218" height="116" rx="12"/>
    </g>
    <text x="137" y="224" text-anchor="middle" font-size="20">Partition A</text>
    <text x="363" y="224" text-anchor="middle" font-size="20">Partition B</text>
    <text x="589" y="224" text-anchor="middle" font-size="20">Partition C</text>
    <text x="819" y="224" text-anchor="middle" font-size="20">Partition D</text>
    <text x="137" y="256" text-anchor="middle" font-size="22">Jan 1–31</text>
    <text x="363" y="256" text-anchor="middle" font-size="22">Feb 1–28</text>
    <text x="589" y="256" text-anchor="middle" font-size="22">Feb 20–Mar 15</text>
    <text x="819" y="256" text-anchor="middle" font-size="22">Mar 16–Apr 5</text>
    <text x="137" y="288" text-anchor="middle" font-size="21" font-weight="700">SKIP</text>
    <text x="363" y="288" text-anchor="middle" font-size="21" font-weight="700">SKIP</text>
    <text x="589" y="288" text-anchor="middle" font-size="21" font-weight="700">SCAN</text>
    <text x="819" y="288" text-anchor="middle" font-size="21" font-weight="700">SCAN</text>
    <text x="32" y="352" font-size="22">Scan candidates, then evaluate the filter on their rows.</text>
    <text x="32" y="389" font-size="18" fill="#475569">Illustrative ranges. Pruning skips impossible matches; it does not return all rows from a candidate.</text>
  </g>
</svg>
