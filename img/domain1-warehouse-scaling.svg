<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Scale up versus scale out</title>
  <desc id="desc">Scaling up increases resources per cluster for demanding queries. Scaling out adds independent clusters to handle concurrent queries. Both access the same persistent tables.</desc>
  <rect width="960" height="460" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="32" y="44" font-size="28" font-weight="700">Warehouse scaling: two different problems</text>
    <text x="32" y="86" font-size="23" font-weight="700">Scale UP / DOWN</text>
    <text x="510" y="86" font-size="23" font-weight="700">Scale OUT / IN</text>
    <rect x="32" y="110" width="175" height="110" rx="12" fill="#dbeafe"/>
    <text x="119" y="158" text-anchor="middle" font-size="22">Small cluster</text>
    <text x="119" y="192" text-anchor="middle" font-size="20">One query</text>
    <text x="227" y="175" font-size="30">→</text>
    <rect x="270" y="100" width="196" height="140" rx="12" fill="#bfdbfe"/>
    <text x="368" y="153" text-anchor="middle" font-size="22">Larger cluster</text>
    <text x="368" y="187" text-anchor="middle" font-size="20">More resources</text>
    <rect x="510" y="110" width="122" height="110" rx="12" fill="#ccfbf1"/>
    <rect x="648" y="110" width="122" height="110" rx="12" fill="#ccfbf1"/>
    <rect x="786" y="110" width="142" height="110" rx="12" fill="#ccfbf1"/>
    <text x="571" y="158" text-anchor="middle" font-size="21">Cluster 1</text>
    <text x="709" y="158" text-anchor="middle" font-size="21">Cluster 2</text>
    <text x="857" y="158" text-anchor="middle" font-size="21">Cluster 3</text>
    <text x="571" y="192" text-anchor="middle" font-size="20">Query A</text>
    <text x="709" y="192" text-anchor="middle" font-size="20">Query B</text>
    <text x="857" y="192" text-anchor="middle" font-size="20">Query C</text>
    <text x="32" y="278" font-size="21">Need: more memory / compute per query</text>
    <text x="510" y="278" font-size="21">Need: more concurrent queries</text>
    <path d="M250 298 V330 M720 298 V330" stroke="#64748b" stroke-width="2"/>
    <rect x="32" y="330" width="896" height="76" rx="12" fill="#e2e8f0"/>
    <text x="480" y="361" text-anchor="middle" font-size="23" font-weight="700">Same persistent data</text>
    <text x="480" y="390" text-anchor="middle" font-size="20">Resizing or adding clusters does not duplicate the source tables.</text>
    <text x="32" y="438" font-size="18" fill="#475569">Conceptual example. Scale-out primarily improves concurrency, not a single query's speed.</text>
  </g>
</svg>
